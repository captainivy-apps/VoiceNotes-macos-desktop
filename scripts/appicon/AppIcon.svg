<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A5FC7"/>
      <stop offset="1" stop-color="#5B3FA0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8068D0"/>
      <stop offset="1" stop-color="#5B3FA0"/>
    </linearGradient>
    <filter id="iconShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#2A1B52" flood-opacity="0.32"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="26" flood-color="#3A2A66" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="url(#gloss)"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="272" y="232" width="480" height="560" rx="72" ry="72" fill="#ffffff"/>
  </g>

  <g fill="url(#bar)">
    <rect x="322" y="435" width="32" height="70"  rx="16" ry="16"/>
    <rect x="380" y="400" width="32" height="140" rx="16" ry="16"/>
    <rect x="438" y="360" width="32" height="220" rx="16" ry="16"/>
    <rect x="496" y="330" width="32" height="280" rx="16" ry="16"/>
    <rect x="554" y="360" width="32" height="220" rx="16" ry="16"/>
    <rect x="612" y="400" width="32" height="140" rx="16" ry="16"/>
    <rect x="670" y="435" width="32" height="70"  rx="16" ry="16"/>
  </g>

  <g fill="#D9CEF0">
    <rect x="352" y="650" width="320" height="28" rx="14" ry="14"/>
    <rect x="412" y="706" width="200" height="28" rx="14" ry="14"/>
  </g>
</svg>
